name: shopping-manager

services:
  storage:
    image: chrislusf/seaweedfs:4.50
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-webdav=false", "-admin.ui=false", "-s3.iam=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run scripts/dev.ps1 init or make init first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run scripts/dev.ps1 init or make init first}
      S3_BUCKET: ${S3_BUCKET:-shopping-manager-media}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - media_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403 Forbidden'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    # Upstream diagnostics may contain signed URLs. Use health/startup checks.
    logging:
      driver: none
    init: true

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-products_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: migrations
    environment:
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${DB_NAME:-products_db}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'exec migrate -path /migrations -database "postgres://postgres:5432/$$PGDATABASE?sslmode=disable" up'
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENV: dev
      SERVER_PORT: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-products_db}
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run scripts/dev.ps1 init or make init first}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run scripts/dev.ps1 init or make init first}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      ACTIVATION_TTL: ${ACTIVATION_TTL:-24h}
      ACTIVATION_RESEND_INTERVAL: ${ACTIVATION_RESEND_INTERVAL:-60s}
      ACTIVATION_MAIL_TIMEOUT: ${ACTIVATION_MAIL_TIMEOUT:-10s}
      PUBLIC_API_URL: http://localhost:${APP_PORT:-5173}/api
      FRONTEND_URL: http://localhost:${APP_PORT:-5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-30}
      AUTH_REGISTRATION_LIMIT: ${AUTH_REGISTRATION_LIMIT:-10}
      AUTH_RESEND_LIMIT: ${AUTH_RESEND_LIMIT:-10}
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-shopping-manager-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run scripts/dev.ps1 init or make init first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run scripts/dev.ps1 init or make init first}
      S3_REQUEST_TIMEOUT: ${S3_REQUEST_TIMEOUT:-30s}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH_ENABLED: "false"
      SMTP_TLS_REQUIRED: "false"
      SMTP_FROM: shopping-manager@example.test
    depends_on:
      storage:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    init: true

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    init: true

volumes:
  postgres_data:
  media_data:
