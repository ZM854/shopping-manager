# Never log activation secrets, query strings or Referer headers.
map $uri $log_safe_request {
    default 1;
    ~^/activation/ 0;
}

log_format safe_request '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log safe_request if=$log_safe_request;

    location /api/ {
        # Resolve the service again when the backend container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }
}
