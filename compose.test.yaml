# Отдельный проект; не подключает сервисы и volumes рабочего Compose.
name: shopping-manager-tests

services:
  storage-test:
    image: chrislusf/seaweedfs:4.50
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-webdav=false", "-admin.ui=false", "-s3.iam=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: shopping-manager-test-key
      AWS_SECRET_ACCESS_KEY: local-integration-storage-secret-only
      S3_BUCKET: shopping-manager-media-test
    ports:
      - "127.0.0.1:58333:8333"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403 Forbidden'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    logging:
      driver: none
    init: true

  postgres-test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: shopping_manager_test
      POSTGRES_USER: shopping_manager_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_manager_test -d shopping_manager_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-test:
    build:
      context: ./backend
      target: testing
    environment:
      TEST_DATABASE_URL: postgres://shopping_manager_test:local-test-only@postgres-test:5432/shopping_manager_test?sslmode=disable
      TEST_S3_ENDPOINT: http://storage-test:8333
      TEST_S3_BUCKET: shopping-manager-media-test
      TEST_S3_ACCESS_KEY_ID: shopping-manager-test-key
      TEST_S3_SECRET_ACCESS_KEY: local-integration-storage-secret-only
    depends_on:
      storage-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
