services:
  backend:
    build:
      target: development
    command:
      - air
      - -c
      - .air.toml
      - --build.poll
      - "true"
      - --build.poll_interval
      - "1000"
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    healthcheck:
      start_period: 120s

  frontend:
    build:
      target: development
    environment:
      VITE_API_URL: /api
      VITE_ENV: dev
      API_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --port 80 --strictPort"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    healthcheck:
      start_period: 120s

volumes:
  backend_tmp:
  go_modules:
  go_build_cache:
  frontend_node_modules:
  npm_cache:
