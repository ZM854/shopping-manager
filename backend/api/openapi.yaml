openapi: 3.0.3
info:
  title: Shopping Manager API
  version: 0.7.0
  description: >-
    HTTP API авторизации и личных списков покупок. Базовый префикс — /api.
    Операции со списками требуют Bearer access token.
    Регистрация требует подтверждения почты и не создаёт сессию.
    Refresh передаётся только HttpOnly-cookie, access — в JSON.
    Для refresh/logout обязателен Origin из настроенного списка, в том числе для CLI.
    Любой запрос с посторонним, null или неоднозначным Origin даёт 403 origin_forbidden.
    Без Origin остальные маршруты доступны. JSON-тела registration/login/activation/resend ограничены 4096 байтами.
    Login, registration и activation/resend ограничены по IP; отказ — 429 rate_limited
    с Retry-After в секундах. По умолчанию 30/минуту, 10/час и 10/10 минут соответственно.
    Тело запроса к спискам — один JSON-объект до 65536 байт;
    неизвестные и повторяющиеся поля запрещены, имена регистрозависимы.
    Обмен списками создаёт неизменяемый снимок и независимые личные копии.
    Frontend-ссылка имеет вид /share#token=<секрет>; секрет передаётся API
    только в JSON, не в пути или query. Ссылка многоразовая, без срока действия.
    Импорт отправляется только после подтверждения «Добавить»; открытие страницы,
    вход, reload и «Отмена» сами по себе не создают копию.
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Проверка работы HTTP-сервера
      responses:
        '200':
          description: Сервер работает; тело отсутствует
  /registration:
    post:
      summary: Регистрация без выдачи токенов
      description: Создаёт неподтверждённый аккаунт. Для входа требуется активация по письму. Set-Cookie отсутствует.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: {$ref: '#/components/schemas/UserName'}
                email: {$ref: '#/components/schemas/Email'}
                password: {type: string, minLength: 6, maxLength: 72, description: От 6 Unicode-кодовых точек; не более 72 байт UTF-8. Пробелы и регистр сохраняются.}
      responses:
        '201':
          description: Аккаунт создан; требуется подтверждение почты
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationResponse'}
        '400': {$ref: '#/components/responses/AuthBadRequest'}
        '403': {$ref: '#/components/responses/OriginForbidden'}
        '413': {$ref: '#/components/responses/ActivationBodyTooLarge'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '409':
          description: user_already_exists — пользователь с таким email уже существует
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ActivationDeliveryFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /login:
    post:
      summary: Вход после подтверждения почты
      description: Каждый успешный вход создаёт отдельную сессию с абсолютным сроком JWT_REFRESH_TTL (по умолчанию 30 дней).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {$ref: '#/components/schemas/Email'}
                password: {type: string, minLength: 1, maxLength: 72, description: Не более 72 байт UTF-8; новый минимум длины при входе не применяется.}
      responses:
        '413': {$ref: '#/components/responses/ActivationBodyTooLarge'}
        '429': {$ref: '#/components/responses/AuthRateLimited'}
        '200': {$ref: '#/components/responses/AuthSuccess'}
        '400': {$ref: '#/components/responses/AuthBadRequest'}
        '401':
          description: invalid_credentials — неверный email или пароль
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/EmailNotVerified'}
        '500': {$ref: '#/components/responses/InternalError'}
  /logout:
    post:
      parameters: [{$ref: '#/components/parameters/AuthOrigin'}]
      summary: Выход из текущей сессии
      description: >-
        Отзывает только сессию, совпадающую по пользователю, sid и хешу текущего
        refresh. Старый токен не отзывает уже обновлённую сессию или другой браузер.
        Отсутствующая, недействительная, истёкшая или уже отозванная cookie даёт 200.
        Ошибка БД даёт 500 без очистки cookie. Access действует до exp.
      security: [{}, {refreshCookie: []}]
      responses:
        '403': {$ref: '#/components/responses/OriginForbidden'}
        '200':
          description: Выход выполнен; refresh cookie очищена
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
            Set-Cookie:
              description: Очистка refreshToken с теми же Path=/, HttpOnly, SameSite=Lax, Secure и без Domain, что при выдаче
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
  /refresh:
    post:
      parameters: [{$ref: '#/components/parameters/AuthOrigin'}]
      summary: Обновление токенов подтверждённого пользователя
      description: >-
        Атомарно заменяет refresh только действующей сессии подтверждённого
        аккаунта; абсолютный срок не продлевается. Из двух запросов с одной
        cookie успешен один. Старый/повторный токен, удалённая или истёкшая
        сессия дают 401 без Set-Cookie; ошибка не стирает новую cookie.
        Если успешный ответ потерян, требуется повторный вход. Неподтверждённый
        пользователь получает 403. Отсутствующая сессия никогда не создаётся.
      security: [{refreshCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/AuthSuccess'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/EmailNotVerified'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activation:
    post:
      summary: Подтверждение почты по одноразовому токену
      description: >-
        Письмо открывает frontend /activation/{token}; активация происходит
        только после нажатия кнопки. Токен действует 24 часа по умолчанию.
        Пустые, истёкшие, использованные и заменённые токены отвергаются.
        Тело JSON до 4096 байт. Сессия не создаётся.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  format: uuid
                  minLength: 36
                  maxLength: 36
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '204': {description: Почта подтверждена; тело отсутствует}
        '400':
          description: invalid_activation или validation_failed — недействительный токен или JSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/ActivationBodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /activation/resend:
    post:
      summary: Повторная отправка подтверждения
      description: >-
        Для неизвестного или уже подтверждённого email возвращается нейтральный
        202 без отправки письма. Для pending-аккаунта атомарно заменяет токен;
        предыдущая ссылка перестаёт действовать. Интервал — 60 секунд по умолчанию,
        включая неудачную попытку SMTP. Тело JSON до 4096 байт.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {$ref: '#/components/schemas/Email'}
      responses:
        '202':
          description: Запрос обработан; ответ не подтверждает существование аккаунта
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '400': {$ref: '#/components/responses/AuthBadRequest'}
        '413': {$ref: '#/components/responses/ActivationBodyTooLarge'}
        '429':
          description: activation_cooldown — повтор слишком рано; rate_limited — исчерпан лимит IP
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ActivationDeliveryFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /shopping-lists:
    get:
      security: [{bearerAuth: []}]
      operationId: getShoppingLists
      summary: Все списки текущего пользователя
      description: Порядок по id по возрастанию. Пустая коллекция — [].
      responses:
        '200':
          description: Массив списков
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ShoppingList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      security: [{bearerAuth: []}]
      operationId: createShoppingList
      summary: Создать личный список
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShoppingList'}
      responses:
        '201': {$ref: '#/components/responses/ListResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /shopping-lists/{listId}:
    parameters:
      - {$ref: '#/components/parameters/ListId'}
    get:
      security: [{bearerAuth: []}]
      operationId: getShoppingList
      summary: Метаданные своего списка
      responses:
        '200': {$ref: '#/components/responses/ListResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      security: [{bearerAuth: []}]
      operationId: updateShoppingList
      summary: Переименовать свой список
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShoppingList'}
      responses:
        '200': {$ref: '#/components/responses/ListResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      security: [{bearerAuth: []}]
      operationId: deleteShoppingList
      summary: Удалить свой список вместе с позициями
      responses:
        '204': {description: Список удалён; тело отсутствует}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /shopping-lists/{listId}/shares:
    parameters:
      - {$ref: '#/components/parameters/ListId'}
    post:
      security: [{bearerAuth: []}]
      operationId: createShoppingListShare
      summary: Создать неизменяемый снимок своего списка для обмена
      description: >-
        Только владелец исходного списка может создать снимок. user_id берётся
        из access, поля владельца и содержимое списка в JSON не принимаются.
        Атомарно сохраняются название и все позиции в порядке их ID, включая
        точные количества, null и единицы. Пустой список допустим.
        preserveMarks обязателен: true сохраняет отметки покупки, false
        сбрасывает их только в снимке. Оригинал и его updatedAt не меняются.
        Изменение, очистка и удаление оригинала не меняют снимок или копии.
        token генерируется клиентом один раз на действие; сервер хранит только
        его SHA-256 хеш. Ответ содержит только метаданные, без token и URL.
        Новая ссылка требует новых token и Idempotency-Key. После сети/5xx
        повторяются прежние тело и ключ. Область ключа — пользователь,
        операция создания снимка и конкретный listId. Повтор минимум 24 часа
        возвращает исходные 201/DTO без повторного снимка. При повторе
        проверяется автор снимка; удаление оригинала не мешает вернуть
        ранее сохранённый результат. Другое тело с тем же ключом даёт
        409 idempotency_conflict. Занятый token для нового действия даёт
        409 share_token_conflict без изменения существующего снимка.
        Тело — один JSON-объект в UTF-8 до 65536 байт, включая запросы
        без Content-Length. null, неизвестные и дублирующиеся поля запрещены.
        Все ответы, включая ошибки middleware, имеют Cache-Control: no-store.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShoppingListShare'}
      responses:
        '201':
          description: Снимок создан либо возвращён исходный результат того же действия
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingListShare'}
        '400': {$ref: '#/components/responses/SharingBadRequest'}
        '401': {$ref: '#/components/responses/SharingUnauthorized'}
        '403': {$ref: '#/components/responses/SharingOriginForbidden'}
        '404': {$ref: '#/components/responses/SharingNotFound'}
        '409': {$ref: '#/components/responses/SharingCreateConflict'}
        '413': {$ref: '#/components/responses/SharingBodyTooLarge'}
        '500': {$ref: '#/components/responses/SharingInternalError'}
  /shopping-list-shares/import:
    post:
      security: [{bearerAuth: []}]
      operationId: importShoppingListShare
      summary: Добавить независимую личную копию снимка по ссылке
      description: >-
        Frontend отправляет POST только после явного подтверждения «Добавить»
        авторизованным получателем. Вход сам по себе не подтверждает импорт;
        «Отмена» и открытие страницы не отправляют POST. GET для импорта нет.
        Право получить снимок даёт token из fragment frontend-ссылки;
        исходный listId, ID автора и владельца копии не принимаются.
        Владелец новой копии берётся только из access вызывающего пользователя.
        Любой авторизованный обладатель ссылки, включая её автора, может
        получить копию. Публичного просмотра без входа нет.
        Атомарно создаются новый список и все его позиции из снимка с новыми
        ID и собственными createdAt/updatedAt. Сохраняются название, порядок,
        точные количества, null, единицы и зафиксированные в снимке отметки.
        Пустой снимок создаёт пустой список. Копии редактируются независимо
        от оригинала, снимка и других копий через обычный shopping API.
        Область ключа — пользователь и операция импорта, без listId;
        token входит в хеш тела. Прежний ключ и тело при повторе после
        сети/5xx или refresh access минимум 24 часа возвращают исходные
        201/DTO без дубля и без перезаписи изменённой копии. При повторе
        проверяются владелец и существование результата. Другое тело
        с тем же ключом даёт 409 idempotency_conflict; удалённый результат
        именно этой попытки — 409 resource_deleted.
        Новый Idempotency-Key означает новое подтверждённое добавление
        и создаёт ещё одну копию по тому же token, даже если прежняя копия
        существует или удалена. Два подтверждения в разных вкладках с разными
        ключами создают две копии. Уникальности получатель/снимок нет.
        Удаление оригинала не мешает импорту из сохранённого снимка.
        Тело — один JSON-объект в UTF-8 до 65536 байт, включая запросы
        без Content-Length. null, неизвестные и дублирующиеся поля запрещены.
        Все ответы, включая ошибки middleware, имеют Cache-Control: no-store.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportShoppingListShare'}
      responses:
        '201':
          description: Независимая копия создана либо возвращён исходный результат того же действия
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShoppingList'}
        '400': {$ref: '#/components/responses/SharingBadRequest'}
        '401': {$ref: '#/components/responses/SharingUnauthorized'}
        '403': {$ref: '#/components/responses/SharingOriginForbidden'}
        '404': {$ref: '#/components/responses/SharingNotFound'}
        '409': {$ref: '#/components/responses/SharingImportConflict'}
        '413': {$ref: '#/components/responses/SharingBodyTooLarge'}
        '500': {$ref: '#/components/responses/SharingInternalError'}
  /shopping-lists/{listId}/items:
    parameters:
      - {$ref: '#/components/parameters/ListId'}
    get:
      security: [{bearerAuth: []}]
      operationId: getShoppingItems
      summary: Позиции выбранного своего списка
      description: Порядок по id по возрастанию. Существующий пустой список — [].
      responses:
        '200':
          description: Массив позиций
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ShoppingItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      security: [{bearerAuth: []}]
      operationId: createShoppingItem
      summary: Создать позицию в выбранном своём списке
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShoppingItem'}
      responses:
        '201': {$ref: '#/components/responses/ItemResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      security: [{bearerAuth: []}]
      operationId: clearShoppingList
      summary: Удалить все позиции выбранного своего списка
      description: Список сохраняется. Повторная очистка пустого списка также возвращает 204.
      responses:
        '204': {description: Список пуст; тело отсутствует}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /shopping-lists/{listId}/items/mark-all:
    parameters:
      - {$ref: '#/components/parameters/ListId'}
    patch:
      security: [{bearerAuth: []}]
      operationId: markAllShoppingItems
      summary: Установить или снять отметки у всех позиций своего списка
      description: Одно атомарное действие. Для существующего пустого списка также 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isMarked]
              properties:
                isMarked: {type: boolean}
      responses:
        '204': {description: Отметки обновлены; тело отсутствует}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /shopping-lists/{listId}/items/{itemId}:
    parameters:
      - {$ref: '#/components/parameters/ListId'}
      - {$ref: '#/components/parameters/ItemId'}
    get:
      security: [{bearerAuth: []}]
      operationId: getShoppingItem
      summary: Получить свою позицию в указанном списке
      responses:
        '200': {$ref: '#/components/responses/ItemResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      security: [{bearerAuth: []}]
      operationId: updateShoppingItem
      summary: Изменить переданные поля своей позиции
      description: >-
        Отсутствующее поле не меняется. quantity:null снимает количество.
        null в остальных полях запрещён. Пустое тело {} запрещено.
        isMarked:false снимает отметку без изменения остальных полей.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateShoppingItem'}
      responses:
        '200': {$ref: '#/components/responses/ItemResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      security: [{bearerAuth: []}]
      operationId: deleteShoppingItem
      summary: Удалить свою позицию из указанного списка
      responses:
        '204': {description: Позиция удалена; тело отсутствует}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  headers:
    NoStore:
      description: Ответ не должен сохраняться в кеше
      schema: {type: string, enum: [no-store]}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    AuthOrigin:
      name: Origin
      in: header
      required: true
      schema: {type: string}
      description: Точный origin из конфигурации сервера; отсутствие, null и посторонний origin дают 403 origin_forbidden без изменения cookie.
    ListId:
      name: listId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Ключ одного действия, например crypto.randomUUID(). Минимальный срок
        хранения результата — 24 часа. Область: пользователь и POST-операция,
        а при наличии listId также конкретный список. Повтор нормализованного
        тела с прежним ключом возвращает исходные статус 201 и DTO;
        другое тело — 409 idempotency_conflict. Проверка доступа обязательна
        и при повторе. После удаления созданного ресурса — 409 resource_deleted.
        Новый ключ означает новое действие. В частности, новый подтверждённый
        импорт с новым ключом создаёт ещё одну копию по той же ссылке;
        удаление результата предыдущего действия этому не мешает.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
  schemas:
    RegistrationResponse:
      type: object
      additionalProperties: false
      required: [activationRequired]
      properties:
        activationRequired: {type: boolean, enum: [true]}
    UserDTO:
      type: object
      additionalProperties: false
      required: [id, name, email, isEmailVerified]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        email: {type: string, format: email}
        isEmailVerified: {type: boolean}
    UserName:
      type: string
      minLength: 2
      maxLength: 20
      description: После обрезки Unicode-пробелов по краям; длина в Unicode-кодовых точках. Управляющие символы запрещены.
    Email:
      type: string
      format: email
      maxLength: 254
      description: ASCII email до 254 байт, локальная часть до 64. Unicode-пробелы по краям обрезаются; весь адрес приводится к нижнему регистру.
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, accessToken]
      properties:
        user: {$ref: '#/components/schemas/UserDTO'}
        accessToken: {type: string}
    Id:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^[1-9][0-9]{0,18}$'
      description: Положительный BIGINT до 9223372036854775807. JSON-числа запрещены.
      example: '9007199254740993'
    ListName:
      type: string
      minLength: 1
      maxLength: 100
      description: После обрезки краевых пробелов; длина в Unicode-кодовых точках. Управляющие символы запрещены.
      example: Покупки на неделю
    ItemName:
      type: string
      minLength: 1
      maxLength: 200
      description: После обрезки краевых пробелов; длина в Unicode-кодовых точках. Управляющие символы запрещены.
      example: Молоко
    Quantity:
      type: string
      nullable: true
      maxLength: 13
      pattern: '^(?!0(?:\.0{1,3})?$)(?:0|[1-9][0-9]{0,8})(?:\.[0-9]{1,3})?$'
      description: >-
        null или decimal-строка от 0.001 до 999999999.999, не более 3 знаков
        после точки. Знаки, запятая, экспонента и ведущие нули запрещены.
        NUMERIC в БД, без преобразования в float/JS Number. Ответ убирает
        лишние нули дробной части (1.000 → 1); null не подменяется нулём.
      example: '0.125'
    Unit:
      type: string
      maxLength: 32
      description: Обрезать краевые пробелы; сохранить регистр. Управляющие символы запрещены. Пустая строка допустима.
      example: кг
    ShoppingList:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/ListName'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ShareToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      description: >-
        Секрет ссылки: канонический base64url без padding для 32 случайных байт,
        созданных на клиенте через crypto.getRandomValues. Последний символ
        кодирует четыре бита данных, два неиспользованных бита должны быть нулевыми.
        Пробелы не обрезаются, регистр сохраняется; null запрещён.
        Хранится только SHA-256 хеш. Передаётся только в JSON запроса,
        не включается в ответы, журналы, API path/query или browser storage.
    CreateShoppingListShare:
      type: object
      additionalProperties: false
      required: [token, preserveMarks]
      properties:
        token: {$ref: '#/components/schemas/ShareToken'}
        preserveMarks:
          type: boolean
          description: Обязательный выбор автора. true сохраняет отметки, false сбрасывает их в снимке. В UI по умолчанию выключен.
    ImportShoppingListShare:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {$ref: '#/components/schemas/ShareToken'}
    ShoppingListShare:
      type: object
      additionalProperties: false
      required: [id, createdAt, preserveMarks]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        createdAt: {type: string, format: date-time}
        preserveMarks: {type: boolean}
    ShoppingItem:
      type: object
      additionalProperties: false
      required: [id, listId, name, quantity, unit, isMarked]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        listId: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/ItemName'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit: {$ref: '#/components/schemas/Unit'}
        isMarked: {type: boolean}
    CreateShoppingList:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/ListName'}
    CreateShoppingItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/ItemName'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit: {$ref: '#/components/schemas/Unit'}
        isMarked: {type: boolean, default: false}
    UpdateShoppingItem:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {$ref: '#/components/schemas/ItemName'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit: {$ref: '#/components/schemas/Unit'}
        isMarked: {type: boolean}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, example: validation_failed}
        message: {type: string, example: Проверьте поля запроса}
        fieldErrors:
          type: object
          additionalProperties: {type: string}
  responses:
    SharingBadRequest:
      description: >-
        invalid_request — некорректный JSON/UTF-8, null, неизвестные или повторяющиеся поля;
        validation_failed — отсутствующий/некорректный ID, Idempotency-Key или поле тела.
        Ошибки полей могут передаваться в fieldErrors, без значений секретов.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingUnauthorized:
      description: unauthorized — требуется действующий Bearer access подтверждённого пользователя
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingOriginForbidden:
      description: origin_forbidden — посторонний, null или неоднозначный Origin; cookie не меняется. Отсутствие Origin разрешено.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingNotFound:
      description: not_found — исходный список чужой/отсутствует либо token не соответствует доступному снимку. Ответ не раскрывает автора, внутренний ID или секрет.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingCreateConflict:
      description: >-
        idempotency_conflict — прежний ключ использован с другим телом;
        resource_deleted — созданный этим действием снимок больше не существует;
        share_token_conflict — token уже занят для другого действия создания снимка.
        Удаление исходного списка само по себе не даёт resource_deleted для готового снимка.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingImportConflict:
      description: >-
        idempotency_conflict — прежний ключ использован с другим token;
        resource_deleted — копия, созданная именно этим HTTP-действием, удалена.
        Для нового подтверждённого добавления использовать новый ключ:
        удаление прежней копии не блокирует импорт по ссылке.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingBodyTooLarge:
      description: body_too_large — тело превышает 65536 байт, в том числе без Content-Length
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SharingInternalError:
      description: internal_error — ошибка сервера без SQL, секретов и внутренних деталей; незавершённая операция откатывается целиком
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OriginForbidden:
      description: origin_forbidden — источник запроса не разрешён; cookie не меняется
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthRateLimited:
      description: rate_limited — исчерпан лимит запросов IP
      headers:
        Retry-After: {description: Через сколько секунд можно повторить, schema: {type: integer, minimum: 1}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ActivationBodyTooLarge:
      description: body_too_large — JSON превышает 4096 байт
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ActivationDeliveryFailed:
      description: >-
        activation_delivery_failed — SMTP не принял письмо. Аккаунт остаётся
        неподтверждённым; после регистрации он уже создан. Повторять следует
        /activation/resend после паузы, а не регистрацию. Старый пароль не меняется.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthSuccess:
      description: Безопасные данные пользователя и access; refresh только в cookie
      headers:
        Cache-Control: {schema: {type: string, enum: [no-store]}}
        Set-Cookie:
          description: >-
            refreshToken; HttpOnly; Path=/; SameSite=Lax; без Domain.
            Max-Age/Expires соответствуют оставшемуся сроку сессии.
            Secure при HTTPS; HTTP разрешён только с APP_ENV=dev.
            Значение отсутствует в JSON.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthResponse'}
    AuthBadRequest:
      description: validation_failed — некорректное тело запроса
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    EmailNotVerified:
      description: email_not_verified — требуется подтверждение почты; origin_forbidden — источник запроса не разрешён, сессия при этом не отзывается
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ListResult:
      description: Метаданные списка
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ShoppingList'}
    ItemResult:
      description: Позиция списка
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ShoppingItem'}
    BadRequest:
      description: Некорректный ID, JSON, поля или отсутствующий/некорректный Idempotency-Key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Нет своего списка или позиции именно в нём; чужой ресурс даёт тот же ответ
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: idempotency_conflict или resource_deleted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BodyTooLarge:
      description: JSON превышает 65536 байт
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Ошибка сервера без внутренних деталей
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
