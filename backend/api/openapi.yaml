openapi: 3.0.3
info:
  title: Shopping Manager API
  version: 0.2.0
  description: >-
    Текущие HTTP-маршруты. Все URL используют базовый префикс /api.
    Списки покупок реализованы; их схемы находятся
    в shopping-lists.openapi.yaml. Старые /products удалены.
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Проверка работы HTTP-сервера
      responses:
        '200':
          description: Сервер работает; тело отсутствует
  /registration:
    post:
      summary: Регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                password: {type: string, minLength: 6, maxLength: 72}
      responses:
        '201': {description: Пользователь зарегистрирован}
        '400': {description: Некорректное тело запроса}
        '409': {description: Пользователь уже существует}
        '500': {description: Ошибка сервера}
  /login:
    post:
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Успешный вход}
        '400': {description: Некорректное тело запроса}
        '401': {description: Неверные учётные данные}
        '403': {description: Почта не активирована}
        '500': {description: Ошибка сервера}
  /logout:
    post:
      summary: Выход
      security: [{refreshCookie: []}]
      responses:
        '200': {description: Выход выполнен}
        '401': {description: Cookie отсутствует}
        '500': {description: Ошибка сервера}
  /refresh:
    post:
      summary: Обновление токенов
      security: [{refreshCookie: []}]
      responses:
        '200': {description: Токены обновлены}
        '401': {description: Cookie отсутствует или токен недействителен}
  /activate/{link}:
    get:
      summary: Активация почты по ссылке из письма
      parameters:
        - name: link
          in: path
          required: true
          schema: {type: string}
      responses:
        '302':
          description: Перенаправление на страницу входа frontend
          headers:
            Location:
              schema: {type: string}
        '400': {description: Недействительная ссылка}
        '500': {description: Ошибка сервера}
  /users:
    get:
      summary: Существующий служебный список пользователей
      deprecated: true
      description: Публичный служебный маршрут требует отдельного исправления доступа и DTO.
      responses:
        '200': {description: Список пользователей}
        '500': {description: Ошибка сервера}
  /shopping-lists:
    $ref: './shopping-lists.openapi.yaml#/paths/~1shopping-lists'
  /shopping-lists/{listId}:
    $ref: './shopping-lists.openapi.yaml#/paths/~1shopping-lists~1{listId}'
  /shopping-lists/{listId}/items:
    $ref: './shopping-lists.openapi.yaml#/paths/~1shopping-lists~1{listId}~1items'
  /shopping-lists/{listId}/items/mark-all:
    $ref: './shopping-lists.openapi.yaml#/paths/~1shopping-lists~1{listId}~1items~1mark-all'
  /shopping-lists/{listId}/items/{itemId}:
    $ref: './shopping-lists.openapi.yaml#/paths/~1shopping-lists~1{listId}~1items~1{itemId}'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
